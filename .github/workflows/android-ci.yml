name: Android CI · 骨架构建与 APK 产物

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 检出仓库（与 /data/workspace 同步的同一份代码）
        uses: actions/checkout@v4

      - name: JDK 17（AGP 8.6.1 要求）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备 Android SDK（沙盒无 SDK，构建全在 CI 完成）
        uses: android-actions/setup-android@v3

      - name: 安装对应平台与构建工具
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null

      - name: Gradle 缓存
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: 赋予 gradlew 执行权限
        run: chmod +x gradlew

      - name: 编译 Debug APK（骨架验证，不产出成品功能）
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-skeleton
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: 把流动看板写进本次 Run Summary
        run: |
          echo "## 流动看板" >> "$GITHUB_STEP_SUMMARY"
          cat docs/KANBAN.md >> "$GITHUB_STEP_SUMMARY"
