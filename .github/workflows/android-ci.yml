name: Android CI · 骨架构建与 APK 产物

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 检出仓库（与 /data/workspace 同步的同一份代码）
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 沙盒无 Android SDK，构建全在 CI 完成。
      # ubuntu-latest 镜像自带 Android SDK，不依赖第三方 setup action（首轮即因此失败）。
      - name: 检查并补齐 Android SDK 组件
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          sdkmanager --version || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null 2>&1 || true
          ls "$ANDROID_HOME/platforms"

      - name: 编译 Debug APK（骨架验证，不产出成品功能）
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-skeleton
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: 把流动看板写进本次 Run Summary
        run: |
          echo "## 流动看板" >> "$GITHUB_STEP_SUMMARY"
          cat docs/KANBAN.md >> "$GITHUB_STEP_SUMMARY"
